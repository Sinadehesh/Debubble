name: Store screenshots

# The Google Play screenshots, and a picture of every screen for design review, taken from
# the real app on an emulator. Runs when the screenshot tests or this workflow change, or by
# hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/app/src/androidTest/**'
      - '.github/workflows/store-shots.yml'

concurrency:
  group: store-shots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shots:
    name: Take screenshots
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # See android.yml for why packages is empty.
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Hardware acceleration for the emulator; without it the runner falls back to software
      # emulation and the job takes the best part of an hour.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and the screenshot test
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      # pixel_2 is 1080x1920. Play refuses screenshots more than twice as tall as they are
      # wide, which rules out most newer phone shapes (1080x2400 is 2.2).
      - name: Take the screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: ./android
          script: |
            ./gradlew :app:connectedDebugAndroidTest --stacktrace
            adb pull /data/local/tmp/debubble-shots shots
            adb pull /data/local/tmp/debubble-design design

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: store-screenshots-raw
          path: android/shots/*.png
          if-no-files-found: error

      # Every screen in the app, for reviewing the design as a whole (androidTest/DesignTour).
      - name: Upload design review
        uses: actions/upload-artifact@v7
        with:
          name: design-review
          path: android/design/*.png
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: store-shots-reports
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore
