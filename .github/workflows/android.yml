name: Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v7

      # Temporary: which secrets this workflow can see, by name only (never their values).
      - name: List secret names
        env:
          ALL: ${{ toJSON(secrets) }}
        run: echo "$ALL" | jq -r 'keys[] | select(. != "github_token")'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # `packages: ''` is load-bearing. The action's default is to install "tools", a
      # package Google has removed from the SDK repository, so the default now fails the
      # job during setup with "Failed to find package 'tools'" — before a line of this
      # project is compiled. Installing nothing here is correct: the Android Gradle plugin
      # resolves the platform and build-tools it actually needs on first use.
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: ''

      # Fail loudly and early if the SDK is not usable, rather than surfacing it as a
      # confusing Gradle error several minutes later.
      - name: Verify SDK is usable
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "ANDROID_HOME missing"; exit 1; }
          ls "$ANDROID_HOME"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The APK is the deliverable, so build it before the tests run.
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debubble-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Unit tests
        run: ./gradlew :app:test --stacktrace

      # The signing key lives in the repository's secrets. When it is there, the release
      # bundle (for Google Play) and a release APK are built and signed with it, so every
      # build is the same app to Android and installs over the one before.
      - name: Set up signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing key in the repository secrets; skipping the release build."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          store="$RUNNER_TEMP/upload.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$store"
          alias="$KEY_ALIAS"
          if [ -z "$alias" ]; then
            alias=$(keytool -list -keystore "$store" -storepass "$STORE_PASSWORD" | awk -F, '/PrivateKeyEntry/ {print $1; exit}')
          fi
          echo "::add-mask::$alias"
          echo "DEBUBBLE_STORE_FILE=$store" >> "$GITHUB_ENV"
          echo "DEBUBBLE_KEY_ALIAS=$alias" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release bundle and APK
        if: steps.signing.outputs.ready == 'true'
        env:
          DEBUBBLE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DEBUBBLE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease --stacktrace

      # Fail if either came out unsigned or signed with anything but the key above.
      - name: Check signatures
        if: steps.signing.outputs.ready == 'true'
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs app/build/outputs/apk/release/*.apk | grep -i "certificate SHA-256"
          jarsigner -verify app/build/outputs/bundle/release/*.aab | tail -1
          jarsigner -verify app/build/outputs/bundle/release/*.aab | grep -q "jar verified"

      - name: Upload release bundle
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: debubble-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: debubble-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
